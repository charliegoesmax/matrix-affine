# Super Collab — Continuwuity + Element + BookStack + Logseq + AFFiNE
# Chat + structured wiki + networked notes + infinite canvas

name: super-collab

services:
  # ---------------------------------------------------------------------------
  # Continuwuity (lightweight Rust Matrix homeserver)
  # ---------------------------------------------------------------------------
  continuwuity:
    image: ghcr.io/continuwuity/continuwuity:latest
    container_name: continuwuity
    restart: unless-stopped
    ports:
      - "${CONTINUWUITY_PORT:-6167}:6167"
    environment:
      CONTINUWUITY_SERVER_NAME: ${CONTINUWUITY_SERVER_NAME:-localhost}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: 6167
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_REGISTRATION_TOKEN: ${CONTINUWUITY_REGISTRATION_TOKEN}
      CONTINUWUITY_ALLOW_FEDERATION: "false"
      CONTINUWUITY_ALLOW_CHECK_FOR_UPDATES: "false"
      CONTINUWUITY_MAX_REQUEST_SIZE: "50000000"
      CONTINUWUITY_TRUSTED_SERVERS: '["matrix.org"]'
    volumes:
      - continuwuity_data:/var/lib/continuwuity
      #- ./config/resolv.conf:/etc/resolv.conf:ro
    #healthcheck:
      #test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:6167/_matrix/client/versions || exit 1"]
      #interval: 15s
      #timeout: 5s
      #retries: 10
      #start_period: 20s

# ---------------------------------------------------------------------------
# Optional: run automatically on docker compose up
# ---------------------------------------------------------------------------
  bootstrap:
    image: curlimages/curl:latest
    container_name: bootstrap
    restart: "no"
    depends_on:
      continuwuity:
        condition: service_started
    volumes:
      - ./scripts/bootstrap-rooms.sh:/bootstrap.sh:ro
      - ./config/element-modules:/modules
    environment:
      - HS_URL=http://continuwuity:6167
      - CONTINUWUITY_REGISTRATION_TOKEN=${CONTINUWUITY_REGISTRATION_TOKEN}
      - SERVER_NAME=${CONTINUWUITY_SERVER_NAME:-localhost}
      - BOOKSTACK_URL=http://bookstack:80
      - LOGSEQ_URL=http://logseq:80
      - AFFINE_URL=http://affine_idle:3010
      - MODULES_DIR=/modules
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache jq unzip && /bootstrap.sh"]

  # ---------------------------------------------------------------------------
  # Element Web
  # ---------------------------------------------------------------------------
  element:
    image: vectorim/element-web:latest
    container_name: element
    restart: unless-stopped
    ports:
      - "${ELEMENT_PORT:-8080}:80"
    volumes:
    #  - ./config/element-config.json.orig:/app/config.json:ro,z   # quick rollback
       - ./config/element-config.json:/app/config.json:ro,z      # normal
       - ./config/element-modules:/modules:ro
    depends_on:
      continuwuity:
        condition: service_started

  # ---------------------------------------------------------------------------
  # BookStack + MariaDB
  # ---------------------------------------------------------------------------
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    ports:
      - "${BOOKSTACK_PORT:-6875}:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - APP_URL=http://localhost:6875
      - APP_KEY=${BOOKSTACK_APP_KEY}
      - APP_THEME=custom
      - DB_HOST=bookstack_db
      - DB_PORT=3306
      - DB_USERNAME=${BOOKSTACK_DB_USERNAME}
      - DB_PASSWORD=${BOOKSTACK_DB_PASSWORD}
      - DB_DATABASE=bookstack
    volumes:
      - ./data/bookstack/config:/config:z
      - ./scripts:/scripts:ro          # so functions.php can exec the script
      - ./data/logseq/graph:/logseq-graph   # optional: direct write target
    depends_on:
      bookstack_db:
        condition: service_healthy

  bookstack_db:
    image: mariadb:11
    container_name: bookstack_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${BOOKSTACK_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=${BOOKSTACK_DB_USERNAME}
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASSWORD}
    volumes:
      - bookstack_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Logseq (outliner + block graph)
  # File-based graph lives on the host so the BookStack → Logseq pipeline can write Markdown into it.
  # In the web UI you still pick / confirm the graph folder (File System Access API).
  # ---------------------------------------------------------------------------
  logseq:
    image: ghcr.io/logseq/logseq-webapp:latest
    container_name: logseq
    restart: unless-stopped
    ports:
      - "${LOGSEQ_PORT:-3001}:80"
    volumes:
      - ./data/logseq/graph:/logseq-graph
    # No depends_on needed — it is independent

  # ---------------------------------------------------------------------------
  # AFFiNE idle watcher — starts AFFiNE on first request, stops after 15 min idle
  # Point your browser / Element widget at this port instead of AFFiNE directly.
  # ---------------------------------------------------------------------------
  affine_idle:
    build:
      context: ./scripts
      dockerfile: Dockerfile.affine-idle
    container_name: affine_idle
    restart: unless-stopped
    ports:
      - "${AFFINE_PORT:-3010}:3010"
    environment:
      - IDLE_SECONDS=${AFFINE_IDLE_SECONDS:-900}
      - COMPOSE_PROJECT_DIR=/workspace
      - COMPOSE_FILE=docker-compose.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
    depends_on:
      - continuwuity
      - element
      - bookstack

  # ---------------------------------------------------------------------------
  # AFFiNE (infinite canvas) — managed by the idle watcher above
  # Do NOT publish its port; the watcher proxies to it.
  # ---------------------------------------------------------------------------
  affine:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine
    restart: "no"          # idle watcher controls lifecycle
    # no ports: — traffic comes through affine_idle
    environment:
      - NODE_OPTIONS="--import=./scripts/register.js"
      - AFFINE_SERVER_EXTERNAL_URL=http://localhost:${AFFINE_PORT:-3010}
      - DATABASE_URL=postgres://${AFFINE_DB_USER:-affine}:${AFFINE_DB_PASSWORD}@affine_postgres:5432/${AFFINE_DB_NAME:-affine}
      - REDIS_SERVER_HOST=affine_redis
      - AFFINE_INDEXER_ENABLED=false
    volumes:
      - ./data/affine:/root/.affine
    depends_on:
      affine_postgres:
        condition: service_healthy
      affine_redis:
        condition: service_healthy

  affine_postgres:
    image: postgres:16-alpine
    container_name: affine_postgres
    restart: "no"
    environment:
      POSTGRES_USER: ${AFFINE_DB_USER:-affine}
      POSTGRES_PASSWORD: ${AFFINE_DB_PASSWORD}
      POSTGRES_DB: ${AFFINE_DB_NAME:-affine}
    volumes:
      - ./data/affine_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AFFINE_DB_USER:-affine}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  affine_redis:
    image: redis:7-alpine
    container_name: affine_redis
    restart: "no"
    volumes:
      - ./data/affine_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # MarkupCraft (static browser edition)
  # ---------------------------------------------------------------------------
  markupcraft:
    image: nginx:alpine
    container_name: markupcraft
    restart: unless-stopped
    ports:
      - "${MARKUPCRAFT_PORT:-8000}:80"
    volumes:
      - ./data/markupcraft:/usr/share/nginx/html:ro
    depends_on:
      markupcraft-setup:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # One-shot: download MarkupCraft browser edition + install BookStack theme module
  # ---------------------------------------------------------------------------
  markupcraft-setup:
    image: alpine:latest
    container_name: markupcraft-setup
    restart: "no"
    volumes:
      - ./data/markupcraft:/markupcraft
      - ./data/bookstack/config/www/themes:/themes
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl unzip

        # --- MarkupCraft static files ---
        mkdir -p /markupcraft
        if [ ! -f /markupcraft/index.html ]; then
          echo "Downloading latest MarkupCraft browser edition..."
          # Pin to a known good release; update URL as needed
          curl -fsSL -o /tmp/mc.zip \
            https://github.com/getcadcraft/markupcraft/releases/download/markupcraft-v0.8.1/markupcraft-browser-edition-v0.8.1.zip \
            || curl -fsSL -o /tmp/mc.zip \
            https://github.com/getcadcraft/markupcraft/releases/latest/download/markupcraft-browser-edition-v0.8.1.zip
          unzip -q /tmp/mc.zip -d /tmp/mc
          # Handle both flat and nested zip layouts
          if [ -f /tmp/mc/index.html ]; then
            cp -a /tmp/mc/. /markupcraft/
          else
            cp -a /tmp/mc/*/ /markupcraft/ 2>/dev/null || true
          fi
          rm -rf /tmp/mc /tmp/mc.zip
          echo "MarkupCraft placed in /markupcraft"
        else
          echo "MarkupCraft already present, skipping download"
        fi

        # --- BookStack theme module ---
        MODULE=/themes/custom/modules/markupcraft
        mkdir -p "$MODULE/head"
        cat > "$MODULE/bookstack-module.json" << 'EOF'
        {
          "name": "markupcraft",
          "description": "Open PDFs in MarkupCraft and show version lists"
        }
        EOF
        cat > "$MODULE/head/markupcraft.html" << 'EOF'
        <script>
        (function() {
          const MARKUPCRAFT_BASE = window.location.origin.replace(/:\d+$/, '') + ':8000';
          function isPdfLink(a) {
            const h = (a.href || '').toLowerCase();
            return h.includes('.pdf') || h.includes('/attachment/');
          }
          function addOpenButton(link) {
            if (link.dataset.mcAdded) return;
            link.dataset.mcAdded = '1';
            const btn = document.createElement('button');
            btn.textContent = 'Open in MarkupCraft';
            btn.style.cssText = 'margin-left:6px;padding:1px 6px;font-size:0.8em;cursor:pointer;';
            btn.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              navigator.clipboard?.writeText(link.href);
              window.open(MARKUPCRAFT_BASE, '_blank');
            };
            link.after(btn);
          }
          function groupVersions() {
            const links = document.querySelectorAll('a.attachment-file, .attachment a, a[href*=".pdf"]');
            const groups = {};
            links.forEach(a => {
              const name = (a.textContent || '').trim() || a.href.split('/').pop();
              const base = name.split('[')[0].split('(')[0].replace(/\.pdf$/i, '').trim();
              if (!base) return;
              (groups[base] = groups[base] || []).push({ name, href: a.href, el: a });
            });
            Object.entries(groups).forEach(([base, items]) => {
              if (items.length < 2) return;
              const box = document.createElement('div');
              box.style.cssText = 'margin:6px 0;padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-size:0.85em;';
              box.innerHTML = `<strong>${base} versions:</strong> `;
              items.forEach(v => {
                const a = document.createElement('a');
                a.href = v.href;
                a.textContent = v.name;
                a.target = '_blank';
                a.style.marginRight = '8px';
                box.appendChild(a);
              });
              items[0].el.parentNode.insertBefore(box, items[0].el);
            });
          }
          function init() {
            document.querySelectorAll('a').forEach(a => { if (isPdfLink(a)) addOpenButton(a); });
            groupVersions();
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
          else init();
          setTimeout(init, 1200);
        })();
        </script>
        EOF
        echo "Theme module installed at $MODULE"

volumes:
  continuwuity_data:
  bookstack_db_data:

networks:
  default:
    name: super-collab
