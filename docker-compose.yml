# Super Collab — Continuwuity + Element + BookStack + AFFiNE
# Chat + structured wiki + infinite canvas

name: super-collab

services:
  # ---------------------------------------------------------------------------
  # Continuwuity (lightweight Rust Matrix homeserver)
  # ---------------------------------------------------------------------------
  continuwuity:
    image: forgejo.ellis.link/continuwuation/continuwuity:latest
    container_name: continuwuity
    restart: unless-stopped
    ports:
      - "${CONTINUWUITY_PORT:-6167}:6167"
    environment:
      CONTINUWUITY_SERVER_NAME: ${CONTINUWUITY_SERVER_NAME:-localhost}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: 6167
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_REGISTRATION_TOKEN: ${CONTINUWUITY_REGISTRATION_TOKEN}
      CONTINUWUITY_ALLOW_FEDERATION: "false"
      CONTINUWUITY_ALLOW_CHECK_FOR_UPDATES: "false"
      CONTINUWUITY_MAX_REQUEST_SIZE: "50000000"
      CONTINUWUITY_TRUSTED_SERVERS: '["matrix.org"]'
    volumes:
      - continuwuity_data:/var/lib/continuwuity
      - ./config/resolv.conf:/etc/resolv.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:6167/_matrix/client/versions || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Element Web
  # ---------------------------------------------------------------------------
  element:
    image: vectorim/element-web:latest
    container_name: element
    restart: unless-stopped
    ports:
      - "${ELEMENT_PORT:-8080}:80"
    volumes:
      - ./config/element-config.json:/app/config.json:ro
    depends_on:
      continuwuity:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # BookStack + MariaDB
  # ---------------------------------------------------------------------------
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    ports:
      - "${BOOKSTACK_PORT:-6875}:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - APP_URL=http://localhost:${BOOKSTACK_PORT:-6875}
      - APP_KEY=${BOOKSTACK_APP_KEY}
      - DB_HOST=bookstack_db
      - DB_PORT=3306
      - DB_USER=bookstack
      - DB_PASS=${BOOKSTACK_DB_PASSWORD}
      - DB_DATABASE=bookstack
    volumes:
      - ./data/bookstack/config:/config
    depends_on:
      bookstack_db:
        condition: service_healthy

  bookstack_db:
    image: mariadb:11
    container_name: bookstack_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${BOOKSTACK_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASSWORD}
    volumes:
      - ./data/bookstack/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # AFFiNE idle watcher — starts AFFiNE on first request, stops after 15 min idle
  # Point your browser / Element widget at this port instead of AFFiNE directly.
  # ---------------------------------------------------------------------------
  affine_idle:
    build:
      context: ./scripts
      dockerfile: Dockerfile.affine-idle
    container_name: affine_idle
    restart: unless-stopped
    ports:
      - "${AFFINE_PORT:-3010}:3010"
    environment:
      - IDLE_SECONDS=${AFFINE_IDLE_SECONDS:-900}
      - COMPOSE_PROJECT_DIR=/workspace
      - COMPOSE_FILE=docker-compose.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
    depends_on:
      - continuwuity
      - element
      - bookstack

  # ---------------------------------------------------------------------------
  # AFFiNE (infinite canvas) — managed by the idle watcher above
  # Do NOT publish its port; the watcher proxies to it.
  # ---------------------------------------------------------------------------
  affine:
    image: ghcr.io/toeverything/affine-graphql:stable
    container_name: affine
    restart: "no"          # idle watcher controls lifecycle
    # no ports: — traffic comes through affine_idle
    environment:
      - NODE_OPTIONS="--import=./scripts/register.js"
      - AFFINE_SERVER_EXTERNAL_URL=http://localhost:${AFFINE_PORT:-3010}
      - DATABASE_URL=postgres://${AFFINE_DB_USER:-affine}:${AFFINE_DB_PASSWORD}@affine_postgres:5432/${AFFINE_DB_NAME:-affine}
      - REDIS_SERVER_HOST=affine_redis
      - AFFINE_INDEXER_ENABLED=false
    volumes:
      - ./data/affine:/root/.affine
    depends_on:
      affine_postgres:
        condition: service_healthy
      affine_redis:
        condition: service_healthy

  affine_postgres:
    image: postgres:16-alpine
    container_name: affine_postgres
    restart: "no"
    environment:
      POSTGRES_USER: ${AFFINE_DB_USER:-affine}
      POSTGRES_PASSWORD: ${AFFINE_DB_PASSWORD}
      POSTGRES_DB: ${AFFINE_DB_NAME:-affine}
    volumes:
      - ./data/affine_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AFFINE_DB_USER:-affine}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  affine_redis:
    image: redis:7-alpine
    container_name: affine_redis
    restart: "no"
    volumes:
      - ./data/affine_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  continuwuity_data:

networks:
  default:
    name: super-collab
